    <script>
      if (typeof window.globalThis === 'undefined') {
        window.globalThis = window;
      }
      if (!Object.hasOwn) {
        Object.hasOwn = function (obj, prop) {
          return Object.prototype.hasOwnProperty.call(Object(obj), prop);
        };
      }
      if (!Array.prototype.at) {
        Array.prototype.at = function (n) {
          n = Math.trunc(n) || 0;
          if (n < 0) n += this.length;
          return n < 0 || n >= this.length ? undefined : this[n];
        };
      }
      if (!String.prototype.replaceAll) {
        String.prototype.replaceAll = function (str, newStr) {
          if (Object.prototype.toString.call(str).toLowerCase() === '[object regexp]') {
            return this.replace(str, newStr);
          }
          return this.split(str).join(newStr);
        };
      }
      if (typeof window.crypto !== 'undefined' && !window.crypto.randomUUID) {
        window.crypto.randomUUID = function () {
          return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function (c) {
            var n = Number(c);
            var r = window.crypto.getRandomValues(new Uint8Array(1))[0];
            return (n ^ (r & (15 >> (n / 4)))).toString(16);
          });
        };
      }
      window.__naimCastApiReady = false;
      window.__onGCastApiAvailable = function (isAvailable) {
        if (isAvailable) {
          window.__naimCastApiReady = true;
          try {
            window.dispatchEvent(new Event('naim-cast-api-ready'));
          } catch (e) {}
        }
      };
    </script>
