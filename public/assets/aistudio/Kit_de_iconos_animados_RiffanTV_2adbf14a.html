h2{font-size:18px;margin:34px 0 14px;color:var(--ink)}

.card{margin:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ico{height:132px;display:grid;place-items:center;max-width:100%}.ico svg{max-width:100%;height:auto;filter:drop-shadow(0 0 8px rgba(124,58,237,.4))}

button:hover{border-color:var(--accent)}button:focus-visible{outline:3px solid #4cc9f0;outline-offset:2px}button.ok{background:var(--accent);border-color:var(--accent);color:#fff}
