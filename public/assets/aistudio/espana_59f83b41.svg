<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <title>Bandera de España</title>
  <defs>
    <clipPath id="es-shield">
      <path d="M248,236 H352 V332 A52,56 0 0,1 248,332 Z" />
    </clipPath>
  </defs>
  <!-- Franjas roja, gualda y roja (1:2:1) -->
  <rect width="900" height="600" fill="#AA151B" />
  <rect y="150" width="900" height="300" fill="#F1BF00" />

  <!-- Escudo de España -->
  <g>
    <!-- Corona Real -->
    <g>
      <!-- Cruz y Orbe -->
      <path d="M298.5,172 H301.5 V176 H305.5 V179 H301.5 V183 H298.5 V179 H294.5 V176 H298.5 Z" fill="#F1BF00" stroke="#2B1D00" stroke-width="1.2" stroke-linejoin="round" />
      <circle cx="300" cy="188" r="5" fill="#0039A6" stroke="#2B1D00" stroke-width="1.3" />
      <path d="M295.2,188 H304.8 M300,183 V193" stroke="#F1BF00" stroke-width="1.2" />

      <!-- Bonete de gules -->
      <path d="M261,218 C255,200 278,191 300,196 C322,191 345,200 339,218 Z" fill="#AA151B" stroke="#2B1D00" stroke-width="1.5" />

      <!-- Diademas doradas -->
      <path d="M258,215 C254,193 282,188 300,194" fill="none" stroke="#2B1D00" stroke-width="5.5" stroke-linecap="round" />
      <path d="M258,215 C254,193 282,188 300,194" fill="none" stroke="#F1BF00" stroke-width="3" stroke-linecap="round" />

      <path d="M342,215 C346,193 318,188 300,194" fill="none" stroke="#2B1D00" stroke-width="5.5" stroke-linecap="round" />
      <path d="M342,215 C346,193 318,188 300,194" fill="none" stroke="#F1BF00" stroke-width="3" stroke-linecap="round" />

      <path d="M278,215 C277,196 290,191 300,194" fill="none" stroke="#2B1D00" stroke-width="5" stroke-linecap="round" />
      <path d="M278,215 C277,196 290,191 300,194" fill="none" stroke="#F1BF00" stroke-width="2.6" stroke-linecap="round" />

      <path d="M322,215 C323,196 310,191 300,194" fill="none" stroke="#2B1D00" stroke-width="5" stroke-linecap="round" />
      <path d="M322,215 C323,196 310,191 300,194" fill="none" stroke="#F1BF00" stroke-width="2.6" stroke-linecap="round" />

      <line x1="300" y1="215" x2="300" y2="193" stroke="#2B1D00" stroke-width="5" />
      <line x1="300" y1="215" x2="300" y2="193" stroke="#F1BF00" stroke-width="2.6" />

      <!-- Perlas -->
      <g fill="#FFFFFF">
        <circle cx="257" cy="207" r="1.4" />
        <circle cx="262" cy="198" r="1.4" />
        <circle cx="271" cy="193" r="1.4" />
        <circle cx="283" cy="191" r="1.4" />
        <circle cx="343" cy="207" r="1.4" />
        <circle cx="338" cy="198" r="1.4" />
        <circle cx="329" cy="193" r="1.4" />
        <circle cx="317" cy="191" r="1.4" />
        <circle cx="278" cy="206" r="1.3" />
        <circle cx="282" cy="198" r="1.3" />
        <circle cx="290" cy="194" r="1.3" />
        <circle cx="322" cy="206" r="1.3" />
        <circle cx="318" cy="198" r="1.3" />
        <circle cx="310" cy="194" r="1.3" />
        <circle cx="300" cy="207" r="1.3" />
        <circle cx="300" cy="200" r="1.3" />
      </g>

      <!-- Florones -->
      <path d="M259,221 L254,213 L260,215 L264,210 L268,216 L273,213 L278,216 L283,210 L288,216 L294,213 L300,209 L306,213 L312,216 L317,210 L322,216 L327,213 L332,216 L336,210 L340,215 L346,213 L341,221 Z" fill="#F1BF00" stroke="#2B1D00" stroke-width="1.4" stroke-linejoin="round" />

      <!-- Aro base y pedrería -->
      <rect x="259" y="220" width="82" height="11" rx="2" fill="#F1BF00" stroke="#2B1D00" stroke-width="1.5" />
      <rect x="297" y="223" width="6" height="5" rx="1" fill="#AA151B" stroke="#2B1D00" stroke-width="0.9" />
      <circle cx="282" cy="225.5" r="2.3" fill="#007A3D" stroke="#2B1D00" stroke-width="0.9" />
      <circle cx="318" cy="225.5" r="2.3" fill="#007A3D" stroke="#2B1D00" stroke-width="0.9" />
      <circle cx="268" cy="225.5" r="2" fill="#0039A6" stroke="#2B1D00" stroke-width="0.9" />
      <circle cx="332" cy="225.5" r="2" fill="#0039A6" stroke="#2B1D00" stroke-width="0.9" />
    </g>

    <!-- Columnas de Hércules -->
    <g>
      <!-- Columna izquierda (Plus) -->
      <path d="M207,242 L206,232 L211,235 L216,230 L221,235 L226,232 L225,242 Z" fill="#F1BF00" stroke="#2B1D00" stroke-width="1.2" stroke-linejoin="round" />
      <rect x="205" y="243" width="22" height="6" fill="#F1BF00" stroke="#2B1D00" stroke-width="1.2" />
      <rect x="209" y="249" width="14" height="137" fill="#D1D5DB" stroke="#4B5563" stroke-width="1" />
      <rect x="205" y="386" width="22" height="7" fill="#F1BF00" stroke="#2B1D00" stroke-width="1.2" />
      <path d="M202,394 Q209,390 216,394 T230,394 V403 H202 Z" fill="#0039A6" />
      <path d="M198,308 L234,322 V334 L198,320 Z" fill="#AA151B" />
      <text x="216" y="324" font-family="sans-serif" font-size="8" font-weight="bold" fill="#F1BF00" text-anchor="middle" transform="rotate(21 216 321)">PLVS</text>

      <!-- Columna derecha (Ultra) -->
      <path d="M375,242 L374,232 L379,235 L384,230 L389,235 L394,232 L393,242 Z" fill="#F1BF00" stroke="#2B1D00" stroke-width="1.2" stroke-linejoin="round" />
      <rect x="373" y="243" width="22" height="6" fill="#F1BF00" stroke="#2B1D00" stroke-width="1.2" />
      <rect x="377" y="249" width="14" height="137" fill="#D1D5DB" stroke="#4B5563" stroke-width="1" />
      <rect x="373" y="386" width="22" height="7" fill="#F1BF00" stroke="#2B1D00" stroke-width="1.2" />
      <path d="M370,394 Q377,390 384,394 T398,394 V403 H370 Z" fill="#0039A6" />
      <path d="M366,322 L402,308 V320 L366,334 Z" fill="#AA151B" />
      <text x="384" y="324" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#F1BF00" text-anchor="middle" transform="rotate(-21 384 321)">VLTRA</text>
    </g>

    <!-- Cuarteles del Escudo -->
    <g clip-path="url(#es-shield)">
      <!-- 1. Castilla -->
      <rect x="248" y="236" width="52" height="66" fill="#AA151B" />
      <path d="M261,286 V264 H265 V268 H270 V260 H278 V268 H283 V264 H287 V286 Z" fill="#F1BF00" />
      <!-- 2. León -->
      <rect x="300" y="236" width="52" height="66" fill="#FFFFFF" />
      <path d="M321,286 L323,272 L316,266 L322,258 L328,254 L334,260 L331,270 L336,286 H330 L327,277 L325,286 Z" fill="#9B1B5A" />
      <polygon points="323,253 326,248 329,253" fill="#F1BF00" stroke="#2B1D00" stroke-width="0.8" />
      <!-- 3. Aragón -->
      <rect x="248" y="302" width="52" height="86" fill="#F1BF00" />
      <rect x="255" y="302" width="6" height="86" fill="#AA151B" />
      <rect x="267" y="302" width="6" height="86" fill="#AA151B" />
      <rect x="279" y="302" width="6" height="86" fill="#AA151B" />
      <rect x="291" y="302" width="6" height="86" fill="#AA151B" />
      <!-- 4. Navarra -->
      <rect x="300" y="302" width="52" height="86" fill="#AA151B" />
      <g stroke="#F1BF00" stroke-width="2.5" fill="none">
        <rect x="308" y="310" width="36" height="44" />
        <line x1="308" y1="310" x2="344" y2="354" />
        <line x1="344" y1="310" x2="308" y2="354" />
        <line x1="326" y1="310" x2="326" y2="354" />
        <line x1="308" y1="332" x2="344" y2="332" />
      </g>
      <circle cx="326" cy="332" r="4" fill="#007A3D" />
      <!-- Entado en punta: Granada -->
      <path d="M278,388 L300,360 L322,388 Z" fill="#FFFFFF" />
      <circle cx="300" cy="378" r="4.5" fill="#AA151B" />
      <path d="M296,373 L300,369 L304,373" fill="none" stroke="#007A3D" stroke-width="2" />
    </g>

    <!-- Contorno escudo y escusón Borbón-Anjou -->
    <path d="M248,236 H352 V332 A52,56 0 0,1 248,332 Z" fill="none" stroke="#2B1D00" stroke-width="2" />
    <ellipse cx="300" cy="302" rx="13" ry="16" fill="#0039A6" stroke="#AA151B" stroke-width="2.5" />
    <circle cx="295.5" cy="298" r="2.2" fill="#F1BF00" />
    <circle cx="304.5" cy="298" r="2.2" fill="#F1BF00" />
    <circle cx="300" cy="307.5" r="2.2" fill="#F1BF00" />
  </g>
</svg>
