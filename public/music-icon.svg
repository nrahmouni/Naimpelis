<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rm-bg-base" x1="50" y1="20" x2="462" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101C26" />
      <stop offset="55%" stop-color="#070D14" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>
    <radialGradient id="rm-glow-emerald" cx="44%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.42" />
      <stop offset="52%" stop-color="#14B8A6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#05080D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rm-glow-cyan" cx="74%" cy="76%" r="48%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#05080D" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rm-stem-grad" x1="165" y1="96" x2="145" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="48%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>

    <linearGradient id="rm-leg-grad" x1="215" y1="248" x2="386" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="48%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <linearGradient id="rm-bow-grad" x1="150" y1="96" x2="368" y2="278" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="58%" stop-color="#ECFEFF" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <linearGradient id="rm-shadow-leg" x1="230" y1="246" x2="278" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#03070B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#03070B" stop-opacity="0" />
    </linearGradient>

    <filter id="rm-fold-drop" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#02060A" flood-opacity="0.66" />
    </filter>
  </defs>

  <!-- Studio Obsidian Squircle Frame -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#rm-bg-base)" stroke="#34D399" stroke-opacity="0.32" stroke-width="8" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#rm-glow-emerald)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#rm-glow-cyan)" />

  <!-- Top Rim Specular Glint -->
  <path d="M 148 16.5 H 364" stroke="#A7F3D0" stroke-opacity="0.28" stroke-width="4" stroke-linecap="round" />

  <!-- Subtle Acoustic Waveform Arc -->
  <path d="M 392 142 C 420 176 432 214 432 256 C 432 298 420 336 392 370" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="10" stroke-linecap="round" />
  <path d="M 418 178 C 436 202 444 228 444 256 C 444 284 436 310 418 334" stroke="#10B981" stroke-opacity="0.22" stroke-width="8" stroke-linecap="round" />

  <!-- 3D Folded Ribbon R Monogram (Riffan Music) -->
  <g>
    <path
      d="M 156 96 H 214 L 184 416 H 126 C 117 416 112 409 113 399 L 143 111 C 144 102 149 96 156 96 Z"
      fill="url(#rm-stem-grad)"
    />
    <path
      d="M 204 260 L 278 248 L 386 401 C 392 409 387 416 376 416 H 320 C 314 416 310 413 306 407 L 204 260 Z"
      fill="url(#rm-leg-grad)"
    />
    <path
      d="M 204 260 L 278 248 L 315 300 L 236 306 Z"
      fill="url(#rm-shadow-leg)"
    />
    <path
      filter="url(#rm-fold-drop)"
      d="M 156 96 H 290 C 358 96 396 132 390 189 C 384 246 344 278 272 278 H 197 L 203 220 H 268 C 306 220 326 206 328 186 C 330 165 312 152 276 152 H 138.8 L 143 111 C 144 102 149 96 156 96 Z"
      fill="url(#rm-bow-grad)"
    />
  </g>
</svg>
