<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rtv-bg-base" x1="60" y1="30" x2="452" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141726" />
      <stop offset="55%" stop-color="#07080C" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>
    <radialGradient id="rtv-glow-violet" cx="50%" cy="38%" r="56%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32" />
      <stop offset="52%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07080C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rtv-glow-cyan" cx="64%" cy="72%" r="42%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#07080C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rtv-platinum-arch" x1="130" y1="120" x2="410" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="rtv-blade-accent" x1="220" y1="288" x2="352" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="52%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Cinema Obsidian Squircle Frame -->
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#rtv-bg-base)" stroke="rgba(255,255,255,0.14)" stroke-width="8" />
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#rtv-glow-violet)" />
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#rtv-glow-cyan)" />

  <!-- Top Rim Specular Glint -->
  <path d="M 120 16 H 392" stroke="rgba(255,255,255,0.24)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Kinetic Blade R Emblem (8° Forward Slant, Center at 256,256) -->
  <g transform="matrix(1 0 -0.1405 1 36 0)">
    <!-- 1. Detached Electric Violet → Cyan Diagonal Kicker Blade -->
    <path d="M 230 290 H 296 L 354 382 H 288 Z" fill="url(#rtv-blade-accent)" />

    <!-- 2. Continuous Brushed Platinum Upper Arch with Crisp Negative ▶ Play Counter -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M 148 120 H 304 C 362 120 384 152 384 204 C 384 256 358 280 296 280 H 218 L 210 382 H 148 Z M 216 166 V 234 L 286 200 Z" fill="url(#rtv-platinum-arch)" />
  </g>
</svg>
